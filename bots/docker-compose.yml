# YieldSolver stack: one image for the bots (one service per bot, each owning its key — no nonce sharing)
# plus the dashboard.
#
#   cp .env.example .env        # fill RPC + keys (or reuse the generated one)
#   docker compose up -d --build
#   open http://localhost:4173   # dashboard   ·   http://localhost:8080/v1/snapshot   # relayer
#
# State (relayer orders, keeper/APY samples) lives in ./.state on the host, so containers and `npm run all`
# can hand over to each other without losing history. Never run both at once: they share keys.
x-bot: &bot
  build: .
  image: yieldsolver-bots
  env_file: .env
  user: node
  restart: unless-stopped
  environment:
    # These override values from .env (which are meant for running on the host).
    RELAYER_URL: http://relayer:8080
    STATE_DIR: /app/state
    HEALTH_PORT: "9100"
  volumes:
    - ../contracts/deployments:/app/contracts/deployments:ro
    - ./.state:/app/state
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9100').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 30s
    timeout: 5s
    start_period: 30s
    retries: 3

services:
  relayer:
    <<: *bot
    command: ["relayer"]
    ports: ["8080:8080"]
  sim:
    <<: *bot
    command: ["sim"]
  keeper:
    <<: *bot
    command: ["keeper"]
  resolver:
    <<: *bot
    command: ["resolver"]
    depends_on: [relayer]
  maker:
    <<: *bot
    command: ["maker"]
    depends_on: [relayer]

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    image: yieldsolver-web
    restart: unless-stopped
    environment:
      RELAYER_PROXY_TARGET: http://relayer:8080
    ports: ["4173:4173"]
    depends_on: [relayer]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
