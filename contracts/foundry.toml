[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }]
# 1inch LOP v4 / Fusion settlement are compiled exactly like upstream (via-IR, 1M runs); our contracts keep the
# default pipeline.
additional_compiler_profiles = [{ name = "oneinch", via_ir = true, optimizer_runs = 1000000 }]
compilation_restrictions = [
    { paths = "lib/limit-order-protocol/contracts/**", via_ir = true, optimizer_runs = 1000000 },
    { paths = "lib/fusion-protocol/contracts/**", via_ir = true, optimizer_runs = 1000000 },
    { paths = "src/external/**", via_ir = true, optimizer_runs = 1000000 },
]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@1inch/solidity-utils/=lib/solidity-utils/",
    "@1inch/aqua/=lib/aqua/src/",
    "@1inch/limit-order-protocol-contract/=lib/limit-order-protocol/",
    "@1inch/fusion-protocol/=lib/fusion-protocol/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 5000

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }

[fmt]
line_length = 120
